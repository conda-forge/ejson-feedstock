schema_version: 1

context:
  version: "1.5.5"

package:
  name: ejson
  version: ${{ version }}

source:
  url: https://github.com/Shopify/ejson/archive//v${{ version }}.tar.gz
  sha256: b77e7ee1c067056c0da84119e5f2e9c83d4e0274e806111705931ba935d9a6b0

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - ejson --help

about:
  license: MIT
  license_file:
    - LICENSE.txt
    - license-files/
  summary: EJSON is a small library to manage encrypted secrets using asymmetric encryption.
  homepage: https://github.com/Shopify/ejson
  repository: https://github.com/Shopify/ejson

extra:
  recipe-maintainers:
    - danielnachun
